[project]
name = "cloudops-lab"
version = "0.1.0"
description = "A hands-on Google Cloud engineering platform focused on infrastructure automation, cloud operations, and Associate Cloud Engineer certification preparation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]