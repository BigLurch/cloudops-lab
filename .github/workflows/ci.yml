name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: Documentation Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate documentation structure
        shell: bash
        run: |
          set -euo pipefail

          test -s README.md
          test -d docs

          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("docs").rglob("*.md"))
          if not files:
              raise SystemExit("No Markdown documentation found in docs/")

          print(f"Documentation check passed: {len(files)} Markdown files found.")
          PY

  python-lint:
    name: Python Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.13"

      - name: Install Python
        run: uv python install

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run Ruff lint
        run: uv run --locked ruff check .

      - name: Check Python formatting
        run: uv run --locked ruff format --check .

  python-tests:
    name: Python Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.13"

      - name: Install Python
        run: uv python install

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run --locked pytest -v